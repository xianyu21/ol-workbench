# Release 自动化：推送 v* tag 时构建 Windows / macOS 安装包并创建正式 Release（全自动发版）。
# 手动触发（Actions → Release → Run workflow）：只构建并上传 artifact，不创建 Release，便于验包。
# 注：macOS dmg 只能在 macOS runner 上构建（macos-14 arm64 runner 交叉产出 x64 包，Intel 原生跑 / Apple Silicon 走 Rosetta）。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win
            target: --win
          - os: macos-14
            name: mac-x64
            target: --mac --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps (desktop)
        working-directory: desktop
        run: npm ci

      - name: Install deps (viewer)
        working-directory: desktop/viewer
        run: npm ci

      - name: Build viewer
        working-directory: desktop
        run: npm run build:viewer

      - name: Generate app icons (ico + 1024 png)
        working-directory: desktop
        run: |
          mkdir -p build
          node gen-icon.js
          node gen-icon.js png 1024

      - name: Convert png to .icns (macOS only)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          mkdir -p build/icon.iconset
          for s in 16 32 128 256 512; do
            sips -z "$s" "$s" build/icon.png --out "build/icon.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z "$d" "$d" build/icon.png --out "build/icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns
          ls -lh build/icon.icns

      - name: Build installers (${{ matrix.name }})
        working-directory: desktop
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # 无开发者证书环境：跳过自动查找签名身份，避免构建中断（产物为未签名包）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: warn

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: dist/**
